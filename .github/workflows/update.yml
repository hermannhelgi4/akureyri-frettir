
name: Uppfæra fréttir

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sækja fréttir
        run: python frettir.py
      - name: Vista niðurstöðu
        run: |
          git config user.name "frettir-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Uppfæra fréttir"
          git pull --rebase
          git push
